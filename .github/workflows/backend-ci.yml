name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  backend-unit:
    name: backend-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        working-directory: backend
        run: pytest -p no:cacheprovider tests/unit -q

  backend-search-mysql:
    name: backend-search-mysql
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: jobbridge_test
          MYSQL_USER: jobbridge_test
          MYSQL_PASSWORD: jobbridge_test
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ujobbridge_test -pjobbridge_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: jobbridge_test
      DB_USER: jobbridge_test
      DB_PASSWORD: jobbridge_test
      RUN_INTEGRATION: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run MySQL integration tests
        working-directory: backend
        run: >-
          pytest -p no:cacheprovider
          tests/integration/test_search_sql_mysql.py
          tests/integration/test_phase10_preflight_mysql.py
          tests/integration/test_job_replace_mysql.py -q

  backend-recommendation-mysql:
    name: backend-recommendation-mysql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: jobbridge_test
          MYSQL_USER: jobbridge_test
          MYSQL_PASSWORD: jobbridge_test
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ujobbridge_test -pjobbridge_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PHASE9_DSN: mysql+pymysql://jobbridge_test:jobbridge_test@127.0.0.1:3306/jobbridge_test
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: jobbridge_test
      DB_USER: jobbridge_test
      DB_PASSWORD: jobbridge_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      RUN_INTEGRATION: "1"
      RECOMMENDATION_CONTENT_KEY: ci-only-recommendation-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Start durable Redis
        run: |
          docker run -d --name jobbridge-ci-redis \
            --health-cmd "redis-cli ping" \
            --health-interval 1s \
            --health-retries 30 \
            -p 6379:6379 \
            redis:7 redis-server \
            --appendonly yes \
            --appendfsync always \
            --maxmemory-policy noeviction
          for attempt in {1..30}; do
            if docker exec jobbridge-ci-redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs jobbridge-ci-redis
          exit 1
      - name: Load base schema and conversation migrations
        working-directory: backend
        run: |
          mysql -h127.0.0.1 -ujobbridge_test -pjobbridge_test jobbridge_test < sql/schema.sql
          for f in sql/migrations/phase8_*.sql; do mysql -h127.0.0.1 -ujobbridge_test -pjobbridge_test jobbridge_test < "$f"; done
      - name: Apply and verify Phase 9
        working-directory: backend
        run: |
          python scripts/apply_phase9_migrations.py --manifest sql/migrations/phase9_manifest.sha256 --dsn-env PHASE9_DSN --check
          python scripts/apply_phase9_migrations.py --manifest sql/migrations/phase9_manifest.sha256 --dsn-env PHASE9_DSN --apply
          python scripts/apply_phase9_migrations.py --manifest sql/migrations/phase9_manifest.sha256 --dsn-env PHASE9_DSN --verify
      - name: Run recommendation tests
        working-directory: backend
        # The whole recommendation unit surface, not one file. The three
        # mandated fixed-vector suites, the delivery state machine, the privacy
        # closure and the metrics all live in sibling files, so gating on a
        # single file made this job look far broader than it actually was.
        run: |
          pytest -p no:cacheprovider -q tests/unit -k "recommendation or click_attribution or delivery_state_machine"
          pytest -p no:cacheprovider -q tests/integration/test_recommendation_*.py tests/integration/test_llm_call_policy.py tests/integration/test_redis.py
      - name: Verify revocation fence survives Redis restart
        run: |
          docker exec jobbridge-ci-redis redis-cli SET phase10:ci:revocation-fence retained
          docker restart jobbridge-ci-redis
          for attempt in {1..30}; do
            if docker exec jobbridge-ci-redis redis-cli ping | grep -q PONG; then
              break
            fi
            sleep 1
          done
          test "$(docker exec jobbridge-ci-redis redis-cli --raw GET phase10:ci:revocation-fence)" = retained
