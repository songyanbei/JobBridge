name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  backend-unit:
    name: backend-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        working-directory: backend
        run: pytest -p no:cacheprovider tests/unit -q

  backend-search-mysql:
    name: backend-search-mysql
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: jobbridge_test
          MYSQL_USER: jobbridge_test
          MYSQL_PASSWORD: jobbridge_test
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ujobbridge_test -pjobbridge_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: jobbridge_test
      DB_USER: jobbridge_test
      DB_PASSWORD: jobbridge_test
      RUN_INTEGRATION: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run MySQL search integration tests
        working-directory: backend
        run: pytest -p no:cacheprovider tests/integration/test_search_sql_mysql.py -q
